name: Build and push Docker container
on:
  workflow_call:
    outputs:
      image:
        description: 'The docker image'
        value: ${{ jobs.build-and-push.outputs.image }}
    inputs:
      environment:
        required: true
        type: string

jobs:
  build-and-push:
    name: 'Build'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    env:
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'install dependencies'
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set environment variables
        run: cp .env.ci.${{ inputs.environment }} .env
      - name: 'Build application'
        run: yarn build
      - name: Build and push Docker image
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker-build-push
        with:
          team: skjemadigitalisering
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
