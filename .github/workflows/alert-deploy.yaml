name: Deploy alerts to NAIS
on:
  push:
    branches:
      - main
    paths:
      - '.nais/alerts.yaml'
      - '.nais/dev.yaml'
      - '.nais/prod.yaml'
      - '.github/workflows/alert-deploy.yaml'
jobs:
  apply-alerts:
    name: Apply alerts to cluster
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy to dev
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/alerts.yaml
          VARS: .nais/dev.yaml
      - name: deploy to prod
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/alerts.yaml
          VARS: .nais/prod.yaml
