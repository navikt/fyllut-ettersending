name: 'Build and deploy (dev) fyllut-ettersending'
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**/**.md'

jobs:
  test:
    name: 'Test'
    uses: ./.github/workflows/test.yaml

  build-and-push:
    name: 'Build'
    uses: ./.github/workflows/build-push.yaml
    with:
      environment: dev
    secrets: inherit
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'

  deployAppToDev:
    name: 'Deploy app to dev'
    needs: [build-and-push, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Deploy to DEV'
        uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais.yaml
          VARS: .nais/dev.yaml
          VAR: image=${{ needs.build-and-push.outputs.image }}
