name: 'Test'
run-name: 'Test [${{ github.event_name }}]'
on:
  workflow_call:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - '**/**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**/**.md'

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'install dependencies'
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'lint'
        run: yarn lint
      - name: Set environment variables
        run: cp .env.test .env
      - name: 'Build application'
        run: yarn build
      - name: 'Run mock server'
        run: yarn mocks:no-cli &
      - name: 'Cypress tests'
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          install: false
          start: 'yarn start'
          wait-on: 'http://localhost:3002/fyllut-ettersending, http://localhost:3002/fyllut-ettersending/api/internal/isready'
          config-file: 'cypress.config.ts'
